name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.13"
          - "3.14"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            src/my_chat_web/requirements-dev.txt
            src/my_copilot_agent/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install \
            -r src/my_chat_web/requirements-dev.txt \
            -r src/my_copilot_agent/requirements.txt
      - name: Run tests
        run: python -m pytest
      - name: Check Python and shell syntax
        run: |
          python -m compileall -q src tests scripts/package_web.py
          bash -n scripts/recreate-azure.sh
      - name: Validate Bicep
        run: az bicep build --file infra/web/main.bicep --stdout >/dev/null
