{% extends "base.html" %}
{% block title %}로그인 · My Chat{% endblock %}
{% block body_class %}auth-page{% endblock %}
{% block content %}
<main class="auth-shell">
  <section class="auth-card">
    <div class="brand-mark brand-symbol" aria-hidden="true">
      <img src="/static/favicon.svg" alt="">
    </div>
    <p class="eyebrow">MY CHAT</p>
    <h1>My Chat</h1>
    <p class="auth-copy">사용자별 AI 공간입니다. 계정으로 로그인해 주세요.</p>

    {% if error %}
      <div class="alert alert-error" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="auth-form">
      <input type="hidden" name="csrf" value="{{ csrf_token }}">
      <label for="username">사용자</label>
      <select id="username" name="username" required autofocus>
        {% for username in chat_users %}
          <option value="{{ username }}">{{ username }}</option>
        {% endfor %}
      </select>

      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit" class="button button-primary button-wide">로그인</button>
    </form>
    <p class="auth-note">최초 로그인 후 본인만의 새 비밀번호를 반드시 설정합니다.</p>
  </section>
</main>
{% endblock %}
